<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#15202b; --mut:#667785; --line:#e1e6ea;
  --acc:#0f766e; --acc2:#14b8a6; --accInk:#ffffff; --warn:#b45309; --bad:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1518; --card:#182226; --ink:#e8eef1; --mut:#93a4ad; --line:#27353b; --acc:#14b8a6; --acc2:#0f766e; --accInk:#04201d; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.marca{display:none;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:8px 16px 0}
.marca img{height:30px;border-radius:6px;background:#fff;padding:3px 6px}
.marca b{font-size:15px;display:block;line-height:1.15}
.marca small{font-size:11px;color:var(--mut);display:block}
.tira{display:none;height:4px;background:linear-gradient(90deg,#1e56d6 0 33.3%,#f5c400 33.3% 66.6%,#e2231a 66.6%)}
body.emp .marca{display:flex} body.emp .tira{display:block}
body.emp{--acc:#1e56d6;--acc2:#3d7dff;--accInk:#ffffff}
@media (prefers-color-scheme: dark){ body.emp{--acc:#6f9bff;--acc2:#1e56d6;--accInk:#06122e} body.emp .hero{background:linear-gradient(135deg,#3d7dff,#1e56d6)} }
.nav{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto;padding:10px 16px}
.nav h1{font-size:19px;margin:0;text-transform:capitalize}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:38px;font-size:18px}
.nav .hoy{width:auto;padding:0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0}
.hero .lbl{font-size:13px;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.hero .sub b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.btn{border:0;background:var(--acc);color:var(--accInk);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--mut);padding-bottom:2px}
.day{position:relative;min-height:70px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:4px 3px;text-align:center;overflow:hidden}
.day.vac{visibility:hidden}
.day .n{font-size:12px;font-weight:600;opacity:.75;display:block}
.day .a{font-size:10px;line-height:1.2;display:block;white-space:nowrap;overflow:hidden}
.day .a b{font-size:12px;letter-spacing:-.2px}
.day .x{font-size:9.5px;line-height:1.25;font-weight:700;display:block;white-space:nowrap;letter-spacing:-.3px}
.day.hoy{outline:3px solid var(--acc);outline-offset:-1px}
.day .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
tr.clic{cursor:pointer}
.nota{color:var(--mut);font-size:12px}
h2{font-size:16px;margin:0 0 10px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:200px;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--mut)}
nav.tabs button i{display:block;font-style:normal;font-size:20px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheetbg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px;text-transform:capitalize}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:2px solid transparent;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;background:var(--bg);color:var(--ink)}
.chip.on{border-color:var(--ink)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.fila label{font-size:14px}
.fila small{display:block;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px}
.step b{min-width:78px;text-align:center;font-variant-numeric:tabular-nums}
.fila input.corto{width:110px;text-align:right}
.step input.horas{width:84px;text-align:center;font-size:20px;font-weight:800;padding:6px 4px}
.reparto{background:var(--bg);border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-size:15px}
.reparto small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.total{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:12px;margin:6px 0 12px}
.acc{display:flex;gap:8px}
.acc .btn{flex:1;padding:12px}
.turno{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.g2>div,.g3>div{min-width:0}
.g2 input,.g3 input,.g2 select,.g3 select{min-width:0;padding-left:6px;padding-right:6px}
.g2 label,.g3 label{font-size:12px;color:var(--mut);display:block}
input[type=color]{padding:2px;height:40px}
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:42px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0}
.g2 input,.g3 input,.g2 select,.g3 select{font-size:15px}
.g3 input:disabled,.g2 input:disabled{font-size:13px;opacity:.7}
.mesfila small{white-space:nowrap}
.mesfila{display:grid;grid-template-columns:88px 1fr 96px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.mesfila .b{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.mesfila .b i{display:block;height:100%;background:var(--acc);border-radius:6px}
.mesfila .e{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mesfila small{color:var(--mut);display:block;font-size:11px;font-weight:400}
.nomcab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.nomcab small{display:block;color:var(--mut);font-size:12px}
.nommes{font-weight:800;font-size:17px;white-space:nowrap}
.nomscroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.nom .nomscroll table{width:100%;table-layout:fixed;font-size:12px;border-collapse:collapse}
.nomsem{margin-top:14px;table-layout:fixed} .nomsem td,.nomsem th{font-size:12.5px;padding-left:2px;padding-right:2px} .nomsem th.r{white-space:normal} .nomsem th:first-child{width:19%} .nomsem tr.fuerte td{font-weight:800;background:var(--bg)}
.nom .nomscroll th{background:var(--bg);border:1px solid var(--line);text-align:center;padding:4px 2px;font-size:10px;color:var(--ink)}
.nom .nomscroll td{border:1px solid var(--line);text-align:center;padding:0;vertical-align:top;font-variant-numeric:tabular-nums}
.nom .dn{display:block;background:#15181c;color:#fff;font-weight:700;padding:1px 0}
.nom .hh{display:block;padding:4px 0;font-weight:600} .nom .hh.peq{font-size:7.5px;letter-spacing:-.2px;font-weight:700;padding:6px 0}
.nom td.gris{background:var(--line);opacity:.5}
.nom td.sep,.nom th.sep{border-left:3px solid var(--mut)}
.nom .nomscroll td.sep,.nom .nomscroll td.sep~td{padding:9px 4px;vertical-align:middle}
.nom td.fuerte{font-weight:800}
.nom tr.tot td{font-weight:800;padding:6px 4px;background:var(--bg)}
.nomres{margin-top:14px} .nomres td{font-size:13px} .nomres tr.fuerte td{font-weight:800;background:var(--bg)}
.nomres tr.liq td{font-size:16px;color:var(--acc)}
body.sindinero .dinero{-webkit-text-security:disc;color:transparent;text-shadow:0 0 0 var(--mut)}
body.sindinero .dinero::placeholder{color:transparent}
.oculto{display:none}
details.mas summary{font-weight:700;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="marca" id="marca"></div>
  <div class="nav">
    <button id="ant" aria-label="Anterior">‹</button>
    <h1 id="titulo"></h1>
    <span style="display:flex;gap:6px"><button id="ojo" aria-label="Ocultar o mostrar el dinero" title="Ocultar o mostrar el dinero">👁</button><button class="hoy" id="hoy">Hoy</button><button id="sig" aria-label="Siguiente">›</button></span>
  </div>

<main class="wrap">

  <section id="v-nomina" class="oculto"></section>

</main>

<nav class="tabs">
  <button data-v="mes" class="on"><i>📅</i>Mes</button>
  <button data-v="nomina"><i>🧾</i>Nómina</button>

<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fichero" accept=".json,application/json" class="oculto">

<script src="mis-datos.js" onerror="void 0"></script>
<script>
'use strict';
const CLAVE='miTrabajo.v2', VERSION='18';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW=['L','M','X','J','V','S','D'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const POR_DEFECTO={
  turnos:[{id:1,nombre:'Jornada normal',abr:'8 h',ini:'08:00',fin:'17:00',descanso:60,precio:10,precioExtra:15,color:'#a2d39c',texto:'#000000',tipo:'trabajo'},
          {id:2,nombre:'Vacaciones',abr:'Vac',ini:'08:00',fin:'16:00',descanso:0,precio:10,precioExtra:15,color:'#f7977a',texto:'#550804',tipo:'vacaciones'},
          {id:3,nombre:'Festivo',abr:'Festivo',ini:'08:00',fin:'16:00',descanso:0,precio:10,precioExtra:15,color:'#9e0b0f',texto:'#efefef',tipo:'festivo'}],
  dias:{}, ajustes:{descuento:0,precioNormal:10,precioExtra:14,pctExtra:40,horasSemana:40,turnoDefecto:1}
};

let S=cargar();
let vista='mes';
const hoyD=new Date();
let cur={y:hoyD.getFullYear(),m:hoyD.getMonth()};

function cargar(){
  // Si lo guardado está vacío (se abrió antes de tener datos) y hay datos de partida, se usan los de partida
  try{ const t=localStorage.getItem(CLAVE); if(t){ const d=normalizar(JSON.parse(t)); if(Object.keys(d.dias).length||!window.DATOS_INICIALES) return d; } }catch(e){}
  if(window.DATOS_INICIALES) return normalizar(JSON.parse(JSON.stringify(window.DATOS_INICIALES)));
  return normalizar(JSON.parse(JSON.stringify(POR_DEFECTO)));
}
function normalizar(d){
  d.turnos=Array.isArray(d.turnos)?d.turnos:[]; d.dias=d.dias||{};
  d.ajustes=Object.assign({descuento:0,precioNormal:0,precioExtra:0,horasSemana:40,turnoDefecto:(d.turnos[0]||{}).id||0},d.ajustes||{});
  const a=d.ajustes;
  if(!a.vac) a.vac={desde:'2026-08-31',saldo:0,porMes:2.5,eurDia:0};
  if(a.pctNoche==null) a.pctNoche=20;
  if(a.horasDia==null) a.horasDia=8;
  // Prima fija al mes (si este teléfono aún no la tiene, se toma la de los datos de partida)
  if(!a.prima){ const p0=window.DATOS_INICIALES&&window.DATOS_INICIALES.ajustes&&window.DATOS_INICIALES.ajustes.prima; a.prima=Object.assign({eur:0,nomina:false},p0||{}); }
  if(!a.prima.meses) a.prima.meses={};
  // Nóminas de julio a octubre de 2026 (pedido por Emmanuel el 11-nov-2026): se añaden una vez los días que falten, sin tocar los que ya haya
  if(!a.parcheNominas){ a.parcheNominas=1; const p0=window.DATOS_INICIALES;
    if(p0&&p0.dias){ for(const k in p0.dias) if(k<'2026-11-01'&&!d.dias[k]) d.dias[k]=JSON.parse(JSON.stringify(p0.dias[k])); }
    if(a.vac.desde==='2026-08-31'&&!+a.vac.saldo){ a.vac.desde='2026-06-30'; a.vac.saldo=3; } }
  // Semana del 19-oct-2026 tal como sale en la hoja (miércoles 5 h, viernes 8 h, sábado 5 h): mismo total, días corregidos
  if(!a.parcheOct){ a.parcheOct=1; const p0=window.DATOS_INICIALES, q=k=>d.dias[k]&&Object.keys(d.dias[k]).length===1&&d.dias[k].t===16;
    if(p0&&p0.dias&&q('2026-10-21')&&q('2026-10-23')&&!d.dias['2026-10-24']) ['2026-10-21','2026-10-23','2026-10-24','2026-09-16'].forEach(k=>{ if(p0.dias[k]) d.dias[k]=JSON.parse(JSON.stringify(p0.dias[k])); }); }
  // 16-sep-2026: Emmanuel confirmó (11-nov-2026) que hizo 3 h de noche; la empresa pagó 2
  if(!a.parcheSep16){ a.parcheSep16=1; const x=d.dias['2026-09-16']; if(x&&x.t===16&&x.h===11&&x.noc===120){ x.h=12; x.noc=180; x.nota='Hice 3 h de noche (12 h en total). La empresa pagó 2: falta 1 h, unos 26,5 € brutos'; } }
  if(!a.parche1111){ a.parche1111=1; ['2026-11-03','2026-11-04','2026-11-05','2026-11-11'].forEach(k=>{ const x=d.dias[k], t=x&&d.turnos.find(q=>q.id===x.t); if(x&&t&&t.tipo==='trabajo'&&x.h==null&&!x.sal) x.h=8; }); }   // meses en que Emmanuel ha marcado que se la han dado
  // Nóminas jul–oct 2026: el sábado no es «siempre extra» (cuenta para las 40 h) y el día de vacaciones sale del sueldo mensual ÷ 30
  d.turnos.forEach(t=>{ if(t.tipo==='extra') t.tipo='trabajo'; });
  if(+a.vac.eurDia===191.59) a.vac.eurDia=0;
  if(a.pctExtra==null) a.pctExtra=(a.precioNormal&&a.precioExtra)?Math.round((a.precioExtra/a.precioNormal-1)*1000)/10:40;
  if(!Array.isArray(a.tarifas)||!a.tarifas.length) a.tarifas=[{desde:'2026-11-01',normal:+a.precioNormal||0}];
  return d;
}
function guardar(){ try{localStorage.setItem(CLAVE,JSON.stringify(S));}catch(e){alert('No se pudo guardar en este dispositivo.');} }

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let oculto=false; try{ oculto=localStorage.getItem('miTrabajo.oculto')==='1'; }catch(e){}
const eur=n=>oculto?'••• €':new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);
const num=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:2}).format(n||0);
const p2=n=>String(n).padStart(2,'0');
const clave=(y,m,d)=>y+'-'+p2(m+1)+'-'+p2(d);
const hoyK=()=>{const d=new Date();return clave(d.getFullYear(),d.getMonth(),d.getDate());};
const turno=id=>S.turnos.find(t=>t.id===id);
const mins=h=>{const [a,b]=String(h||'0:0').split(':').map(Number);return (a||0)*60+(b||0);};
function hTurno(t){ let m=mins(t.fin)-mins(t.ini); if(m<0)m+=1440; return Math.max(0,(m-(+t.descanso||0))/60); }
function hm(min){ const h=Math.floor(min/60), m=min%60; return (h?h+' h ':'')+(m||!h?m+' min':''); }

// Horas trabajadas (o pagadas) en un día
function horasDia(d){
  if(!d) return 0; const t=turno(d.t); let h=0;
  if(t){ h=(d.h!=null&&d.h!=='')?+d.h:hTurno(t); h=Math.max(0,h-(d.sal||0)/60); }
  return h+(d.ex||0)/60;
}
// Como la hoja de la empresa (comprobado con las nóminas de julio a octubre de 2026): las primeras 40 h de cada
// semana (lunes a domingo, en orden) son normales y el resto extra al 40 %. Las horas de la semana que caen en el
// mes anterior también cuentan para las 40. Festivos y vacaciones no cuentan: van en líneas aparte.
const esExtra=d=>{ const t=d&&turno(d.t); return !!(t&&(t.tipo==='festivo'||t.tipo==='vacaciones')); };
const tr2=n=>Math.floor(n*100+1e-6)/100;   // la hoja de la empresa corta los céntimos, no redondea
// Reparto de una semana día a día. Las horas extra de cada mes salen de la regla de las 40 h (lo que paga la empresa);
// dentro del mes se apuntan primero a lo que cada día pasa de 8 h y lo que sobre a los últimos días (el sábado).
function repartoSemana(k,ov){
  const get=x=>(ov&&x===k)?ov:S.dias[x];
  const [y,m,dd]=k.split('-').map(Number), lun=dd-((new Date(y,m-1,dd).getDay()+6)%7);
  const tope=+S.ajustes.horasSemana||40, jor=+S.ajustes.horasDia||8, ds=[]; let ac=0;
  for(let i=0;i<7;i++){
    const x=new Date(y,m-1,lun+i), kk=clave(x.getFullYear(),x.getMonth(),x.getDate()), d=get(kk);
    const h=(d&&!esExtra(d))?horasDia(d):0, n=Math.min(h,Math.max(0,tope-ac)); ac+=h;
    ds.push({k:kk,mes:kk.slice(0,7),h,x:h-n,e:0});
  }
  const R={};
  ds.forEach(o=>{ R[o.k]=o; if(o.hecho) return;
    const g=ds.filter(p=>p.mes===o.mes); let q=g.reduce((a,p)=>a+p.x,0);
    g.forEach(p=>{ p.hecho=1; p.e=Math.min(Math.max(0,p.h-jor),q); q-=p.e; });
    for(let i=g.length-1;i>=0&&q>1e-9;i--){ const e=Math.min(g[i].h-g[i].e,q); g[i].e+=e; q-=e; }
  });
  return R;
}
function calc(k,ov){
  const d=(ov||S.dias[k]), r={h:0,hN:0,hX:0,hNoc:0,hF:0,normal:0,extra:0,noche:0,festE:0,vacE:0,ing:0,total:0,t:d?turno(d.t):null};
  if(!d) return r;
  r.h=horasDia(d); const tp=r.t?r.t.tipo:'', tf=tarifa(k);
  if(tp==='vacaciones'){ r.h=0; r.vacE=vacDia(k); }
  else if(tp==='festivo'){ r.hF=r.h; r.h=0; r.festE=r.hF*tf.n; }
  r.hX=r.h?repartoSemana(k,ov)[k].e:0; r.hN=r.h-r.hX;
  r.normal=r.hN*tf.n; r.extra=r.hX*tf.x;
  r.hNoc=(d.noc||0)/60; r.noche=r.hNoc*tf.n*(+S.ajustes.pctNoche||0)/100;
  r.ing=+d.ing||0; r.total=r.normal+r.extra+r.noche+r.festE+r.vacE+r.ing;
  return r;
}
// Lo que pagan por un día de vacaciones. Nómina de agosto de 2026: 8 días = 766,36 €, o sea
// el sueldo de un mes a 40 h por semana (precio × 40 × 52 ÷ 12) repartido entre 30 días. Si en Ajustes hay un importe, manda ese.
function vacDia(k){ const v=S.ajustes.vac||{}; return (+v.eurDia)||tarifa(k).n*(+S.ajustes.horasSemana||40)*52/12/30; }
// Precio de la hora vigente en una fecha (por si hay subidas de sueldo)
function tarifa(k){
  const ts=S.ajustes.tarifas.slice().sort((a,b)=>a.desde<b.desde?-1:1);
  let t=ts[0]; ts.forEach(x=>{ if(x.desde<=k) t=x; });
  const n=+(t&&t.normal)||0; return {n, x:n*(1+(+S.ajustes.pctExtra||0)/100)};
}
function resumenMes(y,m,hastaK){
  const n=new Date(y,m+1,0).getDate();
  const r={total:0,normal:0,extra:0,ing:0,hN:0,hX:0,hNoc:0,noche:0,festH:0,festE:0,vacE:0,trab:0,vac:0,fest:0,libresLV:[],filas:[]};
  for(let d=1;d<=n;d++){
    const k=clave(y,m,d), dia=S.dias[k];
    if(hastaK && k>hastaK) continue;
    if(!dia){ const w=new Date(y,m,d).getDay(); if(w>=1&&w<=5) r.libresLV.push(k); continue; }
    const c=calc(k);
    r.total+=c.total; r.normal+=c.normal; r.extra+=c.extra; r.ing+=c.ing; r.hX+=c.hX; r.hN+=c.hN; r.hNoc+=c.hNoc; r.noche+=c.noche; r.festH+=c.hF; r.festE+=c.festE; r.vacE+=c.vacE;
    if(c.t){ if(c.t.tipo==='vacaciones') r.vac++; else if(c.t.tipo==='festivo') r.fest++; else r.trab++; }
    else if(c.h>0||c.ing>0) r.trab++;
    r.filas.push({k,d,dia,c});
  }
  ['normal','extra','noche','festE','vacE'].forEach(f=>r[f]=tr2(r[f]));
  // Prima: solo cuenta en los meses en que él marca «me la han dado». En nómina entra en el bruto (con CASS); si no, va aparte
  const pr=S.ajustes.prima||{}, mk=y+'-'+p2(m+1), pe=(+pr.eur>0&&pr.meses&&pr.meses[mk])?+pr.eur:0;
  r.prima=pe; r.primaN=pr.nomina?pe:0; r.primaF=pr.nomina?0:pe;
  r.total=Math.round((r.normal+r.extra+r.noche+r.festE+r.vacE+r.ing+r.primaN)*100)/100;
  return r;
}
// Saldo de vacaciones al final de un mes (como el cuadro «Vacances» de la hoja)
function vacSaldo(y,m){
  const v=S.ajustes.vac, [by,bm]=v.desde.split('-').map(Number), meses=Math.max(0,(y-by)*12+(m+1-bm)), fin=clave(y,m,new Date(y,m+1,0).getDate());
  let hechas=0; for(const k in S.dias){ if(k>v.desde&&k<=fin){ const t=turno(S.dias[k].t); if(t&&t.tipo==='vacaciones') hechas++; } }
  return (+v.saldo||0)+meses*(+v.porMes||0)-hechas;
}

    +'<p class="nota" style="margin:8px 0 0">Cada día se paga a '+eur(vd)+'. Cuentan sábados y domingos.</p></div>';
}

function pdfTexto(s){ return String(s).replace(/[–—]/g,'-').replace(/[^\x00-\xff]/g,'?').replace(/([\\()])/g,'\\$1'); }
function hazPdf(L){
  let c='';
  L.forEach(o=>{ if(o.l) c+=(o.g?'0.75 G ':'0 G ')+o.l[0]+' '+o.l[1]+' m '+o.l[2]+' '+o.l[3]+' l S\n'; else c+='BT /'+(o.b?'F2':'F1')+' '+(o.z||10)+' Tf '+o.x+' '+o.y+' Td ('+pdfTexto(o.t)+') Tj ET\n'; });
  const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Length '+c.length+' >>\nstream\n'+c+'endstream'];
  let out='%PDF-1.4\n'; const off=[];
  objs.forEach((o,i)=>{ off.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  const xr=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  const u=new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255; return u;
}
const fechaES=f=>p2(f.getDate())+'/'+p2(f.getMonth()+1)+'/'+f.getFullYear();
function docHoras(desde,nDias,titulo){
  const L=[], X=[40,150,270]; let y=795;
  L.push({x:40,y,t:'Horas trabajadas',b:1,z:18}); y-=22;
  L.push({x:40,y,t:titulo,b:1,z:12}); y-=18;
  if(S.ajustes.nombre){ L.push({x:40,y,t:S.ajustes.nombre,z:12}); y-=14; }
  y-=10; ['Día','Fecha','Horas'].forEach((t,i)=>L.push({x:X[i],y,t,b:1})); y-=5; L.push({l:[40,y,555,y]}); y-=13;
  const T={h:0,hN:0,hX:0,noc:0,fest:0,vac:0,dias:0};
  for(let i=0;i<nDias;i++){
    const f=new Date(desde.getFullYear(),desde.getMonth(),desde.getDate()+i), k=clave(f.getFullYear(),f.getMonth(),f.getDate()), d=S.dias[k], c=calc(k), tp=c.t?c.t.tipo:'';
    const hs=tp==='festivo'?'Festivo':tp==='vacaciones'?'Vacaciones':(c.h?num(c.h)+' h':'Descanso');
    const dn=DIAS[f.getDay()]; [dn[0].toUpperCase()+dn.slice(1),fechaES(f),hs].forEach((t,j)=>L.push({x:X[j],y,t,b:j===2&&c.h>0}));
    if(f.getDay()===0&&i<nDias-1) L.push({l:[40,y-4,555,y-4],g:1});
    T.h+=c.h; T.hN+=c.hN; T.hX+=c.hX; T.noc+=c.hNoc; if(tp==='festivo') T.fest++; else if(tp==='vacaciones') T.vac++; else if(c.h>0) T.dias++;
    y-=14;
  }
  y+=8; L.push({l:[40,y,555,y]}); y-=18;
  L.push({x:40,y,t:'Total de horas: '+num(T.h)+' h',b:1,z:13}); y-=18;
  L.push({x:40,y,t:'Días trabajados: '+T.dias,z:11});
  L.push({x:40,y:40,t:'Generado el '+fechaES(new Date())+' ',z:8});
  return hazPdf(L);
}
function semanasDelMes(y,m){

  for(let s=1-off;s<=n;s+=7){ const a=new Date(y,m,s), b=new Date(y,m,s+6); r.push({a,b,t:'Semana del '+a.getDate()+(a.getMonth()!==b.getMonth()?' de '+MESES[a.getMonth()]:'')+' al '+b.getDate()+' de '+MESES[b.getMonth()]+' de '+b.getFullYear()}); }

function pdfDe(cual){
  const {y,m}=cur;
  if(cual==='m') return {bytes:docHoras(new Date(y,m,1),new Date(y,m+1,0).getDate(),MESES[m][0].toUpperCase()+MESES[m].slice(1)+' de '+y),nombre:'Horas '+MESES[m]+' '+y+'.pdf'};
  const w=semanasDelMes(y,m)[+cual]; return {bytes:docHoras(w.a,7,w.t),nombre:'Horas semana '+p2(w.a.getDate())+'-'+p2(w.a.getMonth()+1)+' a '+p2(w.b.getDate())+'-'+p2(w.b.getMonth()+1)+'-'+w.b.getFullYear()+'.pdf'};

async function compartir(cual){
  const {bytes,nombre}=pdfDe(cual), blob=new Blob([bytes],{type:'application/pdf'});
  try{
    const file=new File([blob],nombre,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:nombre.replace('.pdf','')}); return cierra(); }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); cierra();
}

/* ---------- Hoja de día ---------- */
let ed=null;
function abreDia(k){
  const [y,m,d]=k.split('-').map(Number);
  ed={k,d:Object.assign({t:S.dias[k]?S.dias[k].t:S.ajustes.turnoDefecto,ex:0,sal:0,ing:0,nota:''},S.dias[k]||{}),existe:!!S.dias[k],fecha:DIAS[new Date(y,m-1,d).getDay()]+' '+d+' de '+MESES[m-1]};
  pintaHoja(); $('#sheetbg').classList.add('on');
}
function pintaHoja(){
  const d=ed.d, c=calc(ed.k,d), t=c.t;
  let h='<h3>'+ed.fecha+'</h3><div class="chips">'
    +S.turnos.map(x=>'<button class="chip'+(d.t===x.id?' on':'')+'" data-t="'+x.id+'" style="background:'+esc(x.color)+';color:'+esc(x.texto)+'">'+esc(x.nombre)+'</button>').join('')
    +'<button class="chip'+(!turno(d.t)?' on':'')+'" data-t="0">Libre</button></div>';
  const tp=t?t.tipo:'', T=horasDia(d);
  if(tp!=='vacaciones'){
    h+='<div class="fila"><label>'+(tp==='festivo'?'Horas del festivo<small>Se pagan a precio normal</small>':'Horas trabajadas<small>Más de '+num(jorDia())+' = extra</small>')+'</label>'
      +'<div class="step"><button data-s="T" data-v="-0.5">−</button><input class="horas" type="number" inputmode="decimal" step="0.25" min="0" id="dT" value="'+(+T.toFixed(2))+'"><button data-s="T" data-v="0.5">+</button></div></div>';
    if(tp!=='festivo') h+='<div class="reparto" id="dDet">'+detDia(c)+'</div>';
    h+='<div class="fila"><label>De ellas, de noche<small>De 22 h a 6 h</small></label><div class="step"><button data-s="noc" data-v="-30">−</button><b>'+hm(d.noc||0)+'</b><button data-s="noc" data-v="30">+</button></div></div>';
  }
  h+='<div class="fila"><label>Otro ingreso (€)</label><input class="corto dinero" type="'+(oculto&&d.ing?'password':'number')+'" step="0.01" id="dIng" value="'+(d.ing||'')+'"></div>'
    +'<textarea id="dNota" rows="2" placeholder="Nota del día">'+esc(d.nota||'')+'</textarea>'
    +'<div class="total"><span>Este día</span><span id="dTot">'+eur(c.total)+'</span></div>'
    +'<div class="acc">'+(ed.existe?'<button class="btn bad" id="dBorra">Borrar</button>':'')+'<button class="btn sec" id="dCanc">Cancelar</button><button class="btn" id="dOk">Guardar</button></div>';
  $('#sheet').innerHTML=h;
}
const jorDia=()=>+S.ajustes.horasDia||8;
const hTxt=n=>num(n)+(n===1?' hora':' horas');
function detDia(c){
  const dia=Math.max(0,c.h-jorDia()), tope=num(+S.ajustes.horasSemana||40);
  const sem=c.hX>dia+1e-9?'Esta semana ya pasas de '+tope+' h: este día cuenta como extra.'
    :c.hX<dia-1e-9?'Esta semana no llega a '+tope+' h normales: la empresa paga menos extra.':'';
  return '<b>'+(c.hX>0?(c.hN>0?hTxt(c.hN)+' normales + ':'')+hTxt(c.hX)+' extra':hTxt(c.h)+' normales · sin extra')+'</b>'
    +(sem?'<small>'+sem+'</small>':'')
    +(c.hNoc?'<small>Nocturnidad: +'+eur(c.noche)+'</small>':'');
}
// Pone el total de horas del día (lo que escribe Emmanuel); las «horas de más» antiguas quedan dentro del total
function ponHoras(d,T){
  T=Math.max(0,Math.round((+T||0)*100)/100); d.sal=0; const t=turno(d.t);
  if(t){ d.ex=0; if(Math.abs(T-hTurno(t))<1e-9) delete d.h; else d.h=T; } else { delete d.h; d.ex=Math.round(T*60); }
  if((d.noc||0)>T*60) d.noc=Math.round(T*60);
}
function leeHoja(){
  const d=ed.d, tI=$('#dT'), iI=$('#dIng'), nI=$('#dNota');
  if(tI&&tI.value!==''){ const T=parseFloat(String(tI.value).replace(',','.')); if(isFinite(T)&&Math.abs(T-horasDia(d))>1e-9) ponHoras(d,T); }
  d.ing=+iI.value||0; d.nota=nI.value.trim();
}
function cierra(){ $('#sheetbg').classList.remove('on'); ed=null; }

$('#sheetbg').addEventListener('click',e=>{ if(e.target.id==='sheetbg') cierra(); });
$('#sheet').addEventListener('input',e=>{ if(e.target.id==='dT'||e.target.id==='dIng'){ leeHoja(); const c=calc(ed.k,ed.d); $('#dTot').textContent=eur(c.total); const dd=$('#dDet'); if(dd) dd.innerHTML=detDia(c); } });
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.comp!=null) return compartir(b.dataset.comp);
  if(b.id==='cCanc') return cierra();
  if(!ed) return;
  if(b.dataset.t!=null){ leeHoja(); const d=ed.d; d.t=+b.dataset.t; delete d.h; d.ex=0; d.sal=0; d.noc=Math.min(d.noc||0,Math.round(horasDia(d)*60)); pintaHoja(); }
  else if(b.dataset.s==='T'){ leeHoja(); ponHoras(ed.d,horasDia(ed.d)+(+b.dataset.v)); pintaHoja(); }
  else if(b.dataset.s){ leeHoja(); ed.d.noc=Math.min(Math.round(horasDia(ed.d)*60),Math.max(0,(ed.d.noc||0)+(+b.dataset.v))); pintaHoja(); }
  else if(b.id==='dCanc') cierra();
  else if(b.id==='dBorra'){ delete S.dias[ed.k]; guardar(); cierra(); pinta(); }
  else if(b.id==='dOk'){
    leeHoja(); const d=ed.d, o={t:d.t||0};
    if(d.ex) o.ex=d.ex; if(d.noc) o.noc=d.noc; if(d.sal) o.sal=d.sal; if(d.ing) o.ing=d.ing; if(d.h!=null) o.h=d.h; if(d.nota) o.nota=d.nota;
    S.dias[ed.k]=o; guardar(); cierra(); pinta();
  }
});

async function actualizar(forzar){
  try{
    const v=(await (await fetch('version.txt?'+Date.now(),{cache:'no-store'})).text()).trim();
    if(!forzar&&(v===VERSION||sessionStorage.getItem('miTrabajo.act')===v)) return false;
    sessionStorage.setItem('miTrabajo.act',v);
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(r) await r.update().catch(()=>{});
    location.replace(location.pathname+'?v='+encodeURIComponent(v)); return true;
  }catch(e){ if(forzar) alert('No he podido buscar la actualización. Comprueba la conexión.'); return false; }
}
if(location.protocol.startsWith('http')){ actualizar(false); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) actualizar(false); }); }
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
