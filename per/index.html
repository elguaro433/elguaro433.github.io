<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b5c"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Simulador PER Catalunya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una columna tipo "cuaderno de bitácora": cabecera fija, contenido en tarjetas sobrias, barra de modos abajo en móvil */
:root{
  --bg:#eef3f6; --surface:#ffffff; --ink:#10263a; --muted:#5b7286; --line:#d4dfe7;
  --navy:#123b5c; --sea:#0f7c8c; --flag:#f2b705; --ok:#1d8a4e; --bad:#c2362d; --okbg:#e3f4ea; --badbg:#fbe7e5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1824;--surface:#12253a;--ink:#e6eef4;--muted:#93a9bb;--line:#24405a;--navy:#7fb6e0;--sea:#3cc0cf;--flag:#f5c536;--ok:#4cc985;--bad:#ff7a6e;--okbg:#123a28;--badbg:#3d1d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1824;--surface:#12253a;--ink:#e6eef4;--muted:#93a9bb;--line:#24405a;--navy:#7fb6e0;--sea:#3cc0cf;--flag:#f5c536;--ok:#4cc985;--bad:#ff7a6e;--okbg:#123a28;--badbg:#3d1d1b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.burgee{width:34px;height:24px;flex:none;background:linear-gradient(135deg,var(--flag) 50%,var(--navy) 50%);clip-path:polygon(0 0,100% 50%,0 100%)}
h1{font-family:var(--display);font-size:30px;letter-spacing:.02em;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
nav.tabs button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
button:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
h2{font-family:var(--display);font-size:24px;margin:0;text-wrap:balance}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rule{border-left:4px solid var(--flag);padding:6px 10px;background:color-mix(in srgb,var(--flag) 10%,transparent);border-radius:0 8px 8px 0}
.rule b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.rule span{font-size:12.5px;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-width:0}
.unit:hover{border-color:var(--sea)}
.unit .name{font-weight:600}
.unit .meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea)}
.must{font:600 10.5px var(--body);color:var(--bad);letter-spacing:.06em;text-transform:uppercase}
.btn{font:600 15px var(--body);border:none;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--navy);color:var(--bg)}
.btn.alt{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.flag{background:var(--flag);color:#10263a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.qtext{font-size:17px;font-weight:600;line-height:1.4;margin:6px 0 4px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.opt .k{font-family:var(--mono);font-size:13px;width:22px;height:22px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.opt.sel{border-color:var(--navy)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.explain{border-left:4px solid var(--sea);padding:8px 12px;background:color-mix(in srgb,var(--sea) 9%,transparent);border-radius:0 8px 8px 0;font-size:14px}
.timer{font-family:var(--mono);font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.grid45{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.grid45 button{font:500 12px var(--mono);height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.grid45 button.done{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.grid45 button.cur{outline:2px solid var(--flag)}
.grid45 button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid45 button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.result{font-family:var(--display);font-size:46px;line-height:1}
.pill{display:inline-block;font:600 12px var(--body);padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted)}
.ready{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.gauge{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sea) calc(var(--p)*1%),var(--line) 0)}
.gauge span{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:26px}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.checks li::before{content:"○ ";color:var(--muted)} .checks li.y::before{content:"● ";color:var(--ok)}
.lesson ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sync{font-size:12px;color:var(--muted)}
input[type=date]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="burgee" aria-hidden="true"></div>
    <div>
      <h1>Simulador PER Catalunya</h1>
      <p class="sub">Patrón de Embarcaciones de Recreo · 45 preguntas · 90 min · aprobado con 32</p>
    </div>
  </header>
  <nav class="tabs" aria-label="Secciones">
    <button id="tab-inicio" data-v="inicio">Inicio</button>
    <button id="tab-hoy" data-v="hoy">Sesión de hoy</button>
    <button id="tab-examen" data-v="examen">Simulacro</button>
    <button id="tab-fallos" data-v="fallos">Mis fallos</button>
    <button id="tab-chuleta" data-v="chuleta">Chuleta</button>
  </nav>
  <main id="app"></main>
</div>

<script>
const UNITS=[
 {id:"nom",n:"Nomenclatura náutica",q:4},
 {id:"ama",n:"Amarre y fondeo",q:2},
 {id:"seg",n:"Seguridad",q:4},
 {id:"leg",n:"Legislación",q:2},
 {id:"bal",n:"Balizamiento",q:5,min:3},
 {id:"ripa",n:"Reglamento (RIPA)",q:10,min:5},
 {id:"man",n:"Maniobra",q:2},
 {id:"eme",n:"Emergencias",q:3},
 {id:"met",n:"Meteorología",q:4},
 {id:"nav",n:"Teoría de navegación",q:5},
 {id:"car",n:"Carta de navegación",q:4,min:2},
];
// Banco propio (redactado para estudiar; no copia los exámenes oficiales). a = índice de la correcta.
const Q=[
// ---- Nomenclatura
["nom","¿Por dónde atraviesa el casco el eje (mecha) del timón?",["Limera","Imbornal","Escobén","Bocina"],0,"La limera es el orificio de la mecha del timón. La bocina es la del eje de la hélice."],
["nom","¿Cómo se llaman los orificios por los que sale al mar el agua que cae en cubierta?",["Imbornales","Portillos","Escobenes","Lumbreras"],0,"Los imbornales desaguan la cubierta. El escobén es por donde sale la cadena del ancla."],
["nom","La pieza que prolonga la quilla hacia arriba por la proa es…",["La roda","El codaste","La varenga","El trancanil"],0,"Roda = proa. Codaste = continuación de la quilla por popa."],
["nom","La pieza que prolonga la quilla por la popa es…",["El codaste","La roda","El bao","La regala"],0,"Codaste por popa, roda por proa."],
["nom","Los puntales de cubierta que sujetan el pasamanos (guardamancebos) se llaman…",["Candeleros","Baos","Varengas","Cuadernas"],0,"Candeleros + guardamancebos forman la barandilla de cubierta."],
["nom","Si el calado de popa es mayor que el de proa, el barco está…",["Apopante","Aproante","Sin asiento","En aguas iguales"],0,"Asiento = calado popa − calado proa. Positivo (popa más hundida) = apopante."],
["nom","Calado proa 1,2 m y calado popa 1,8 m. ¿Asiento?",["0,60 m apopante","0,60 m aproante","1,50 m apopante","0,30 m apopante"],0,"1,8 − 1,2 = 0,60 m; como la popa cala más, es apopante."],
["nom","Con calado proa 1,4 m y popa 1,8 m, el calado medio es…",["1,6 m","0,4 m","3,2 m","1,8 m"],0,"Calado medio = (popa + proa) / 2 = (1,8 + 1,4) / 2 = 1,6 m."],
["nom","Mirando hacia proa, la parte del costado más cercana a la popa en el lado izquierdo es…",["Aleta de babor","Amura de babor","Aleta de estribor","Amura de estribor"],0,"Amuras: zona de proa. Aletas: zona de popa. Babor: izquierda mirando a proa."],
["nom","¿Para qué sirve el embrague del molinete?",["Acoplar o desacoplar el barbotén del motor","Frenar el ancla","Bloquear la cadena para siempre","Medir la cadena filada"],0,"Con el embrague suelto la cadena cae libre; embragado, el motor recoge (vira)."],
["nom","Las piezas transversales que sostienen la cubierta de banda a banda son…",["Baos","Cuadernas","Varengas","Mamparos"],0,"Baos: de babor a estribor bajo la cubierta. Cuadernas: las 'costillas' del casco."],
["nom","El manguerote (cuello de cisne) de cubierta sirve para…",["Ventilar los compartimentos interiores","Dar luz al camarote","Desaguar la cubierta","Pasar la cadena"],0,"Es una toma de ventilación."],
["nom","La parte del casco que queda sumergida se llama…",["Obra viva","Obra muerta","Francobordo","Puntal"],0,"Obra viva = sumergida (carena). Obra muerta = por encima de la flotación."],
["nom","Recoger cadena del ancla con el molinete se dice…",["Virar","Filar","Lascar","Arriar"],0,"Virar = recoger. Filar = ir soltando."],
// ---- Amarre y fondeo
["ama","El orinque sirve principalmente para…",["Balizar el ancla con un boyarín","Mantener el barco adrizado","Ayudar al atraque","Medir la sonda"],0,"El orinque une la cruz del ancla con un boyarín: sabes dónde está y ayuda a desenrocarla."],
["ama","Nudo que forma una gaza fija que no se corre:",["As de guía","Ballestrinque","Nudo llano","Vuelta de rezón"],0,"El as de guía es el rey de las gazas: no se corre y se deshace fácil."],
["ama","El círculo que describe un barco fondeado alrededor del ancla se llama…",["Círculo de borneo","Círculo de garreo","Círculo de seguridad","Círculo de fondeo"],0,"El barco 'bornea' con el viento y la corriente."],
["ama","Cuando el ancla se arrastra por el fondo sin agarrar se dice que…",["Garrea","Bornea","Está a pique","Está a la pendura"],0,"Garrear = el ancla no agarra y el barco se desplaza."],
["ama","El ancla está 'a pique' cuando…",["La cadena está vertical, justo antes de desprenderse","Cuelga sin tocar fondo","Está estibada","Ha garreado"],0,"A pique: cadena vertical sobre el ancla. A la pendura: colgando sin tocar fondo."],
["ama","Dar a un cabo la tensión justa, ni flojo ni a punto de romper, es…",["Templar","Adujar","Lascar","Tesar a muerte"],0,"Templar = tensión justa. Lascar = aflojar poco a poco. Adujar = recoger en vueltas."],
["ama","Como regla práctica, ¿cuánta cadena se fila con buen tiempo?",["Unas 3 veces la sonda","Igual que la sonda","10 veces la sonda","La mitad de la sonda"],0,"Con buen tiempo, unas 3 veces la profundidad; con mal tiempo, más (5 o más)."],
// ---- Seguridad
["seg","El dispositivo que suelta sola la balsa salvavidas si el barco se hunde es…",["La zafa hidrostática","El cabo disparador","El gancho automático","La boza"],0,"Actúa por la presión del agua a unos metros de profundidad."],
["seg","El reflector de radar sirve para…",["Que el radar de otros barcos nos detecte","Enviar mensajes","Pedir socorro","Medir distancias"],0,"Aumenta nuestro eco en las pantallas de radar ajenas."],
["seg","¿Qué es 'correr el temporal'?",["Navegar con la popa a la mar","Poner proa a la mar","Ponerse de través","Fondear"],0,"Correr = popa (o aleta) a la mar. Capear = proa (o amura) a la mar."],
["seg","Para reducir los balances, lo más adecuado es…",["Cambiar el rumbo","Aumentar la velocidad","Trasladar pesos a una banda","Tirar pesos por la borda"],0,"Cambiando el rumbo cambiamos cómo nos llega la ola."],
["seg","Los extintores portátiles deben ir…",["En lugares de fácil acceso","Dentro de la cámara de motores","Cerrados con llave","Junto al foco de fuego"],0,"Tienen que poder cogerse rápido."],
["seg","Antes de salir a navegar hay que comprobar, entre otras cosas…",["El nivel de combustible","La temperatura del mar","Cerrar los grifos de fondo","La temperatura del aceite en frío"],0,"Combustible, previsión, equipo de seguridad… Los grifos de fondo deben estar ABIERTOS para refrigerar."],
["seg","Al ver caer a una persona al agua, el timón se mete…",["A la misma banda de la caída","A la banda contraria","A la vía","No se toca"],0,"Así la popa y la hélice se apartan de la persona. Gritar, lanzar aro y no perderla de vista."],
["seg","Navegando por aguas someras hay que extremar precauciones por…",["Riesgo de embarrancar","Más tráfico","Corrientes fuertes","Poca visibilidad"],0,"Somero = poca profundidad."],
["seg","Las bengalas de mano se encienden…",["Por sotavento","Por barlovento","Por la proa","Siempre por babor"],0,"Por sotavento el humo y las chispas no vuelven al barco."],
// ---- Legislación
["leg","Ante un grupo de cetáceos (RD 1727/2007), a menos de 500 m…",["Máximo 4 nudos, sin ruido y nunca a menos de 60 m","Acercarse para observarlos","Hacer ruido para apartarlos","Acelerar para alejarlos"],0,"Nada de perseguirlos ni cortarles el paso."],
["leg","Ante la bandera Alfa (buceo), las demás embarcaciones se mantendrán al menos a…",["50 metros","25 metros","15 metros","100 metros"],0,"Salvo la embarcación de apoyo. (Solución oficial Girona mayo 2026)."],
["leg","¿Se pueden verter al mar aceites, combustibles u otros hidrocarburos?",["No, está prohibido","Sí, a más de 3 millas","Sí, a más de 12 millas","Sí, tratados"],0,"Prohibido siempre."],
["leg","Si ves un vertido de hidrocarburos en el mar, avisas a…",["Salvamento Marítimo","El club náutico","El ayuntamiento","La policía local"],0,"Salvamento Marítimo (SASEMAR), por VHF canal 16 o teléfono 900 202 202."],
["leg","Aguas sucias desmenuzadas y desinfectadas a bordo se pueden descargar a partir de…",["3 millas de tierra","4 millas","12 millas","Cualquier distancia a más de 4 nudos"],0,"Sin tratar, a partir de 12 millas."],
["leg","Para acercarte a una playa NO balizada…",["Máximo 3 nudos y extremando precauciones","Por el centro y rápido","Libremente","Avisando con bocina"],0,"Velocidad muy reducida y cuidado con los bañistas."],
// ---- Balizamiento
["bal","Región A: entrando a puerto, la marca lateral de babor es…",["Roja, con marca de tope cilíndrica","Verde, con cono","Roja, con cono","Amarilla"],0,"Región A (Europa): roja a babor, verde a estribor al entrar."],
["bal","¿De qué color es la luz de una marca lateral de babor en la región A?",["Roja","Verde","Blanca","Amarilla"],0,"La luz es del color de la marca."],
["bal","Entrando a puerto ves por la proa una baliza roja con cilindro. Debes…",["Caer a estribor, dejándola por babor","Caer a babor","Dejarla por estribor","Da igual"],0,"La roja se deja por babor al entrar."],
["bal","¿De qué color es la luz de TODAS las marcas cardinales?",["Blanca","Amarilla","Roja","Verde"],0,"Cardinales siempre luz blanca (centelleante)."],
["bal","Cardinal NORTE: marca de tope…",["Dos conos con los vértices hacia arriba","Dos conos hacia abajo","Opuestos por las bases","Opuestos por los vértices"],0,"Las puntas 'señalan' el Norte (arriba)."],
["bal","Cardinal SUR: marca de tope…",["Dos conos con los vértices hacia abajo","Dos conos hacia arriba","Opuestos por las bases","Opuestos por los vértices"],0,"Puntas hacia abajo = Sur."],
["bal","Cardinal ESTE: marca de tope…",["Dos conos opuestos por las bases (rombo)","Opuestos por los vértices","Hacia arriba","Hacia abajo"],0,"Truco: el Este parece un huevo (E de 'egg')."],
["bal","Cardinal OESTE: marca de tope…",["Dos conos opuestos por los vértices (reloj de arena)","Opuestos por las bases","Hacia arriba","Hacia abajo"],0,"Parece una W tumbada / copa de vino."],
["bal","Una cardinal con 3 centelleos es la…",["Este","Oeste","Sur","Norte"],0,"Como un reloj: Este = 3, Sur = 6 (+1 largo), Oeste = 9, Norte = continuo."],
["bal","6 centelleos + 1 destello largo indican cardinal…",["Sur","Norte","Este","Oeste"],0,"Sur = 6 de las 6 en punto + destello largo."],
["bal","Una cardinal Norte indica que las aguas navegables están…",["Al Norte de la marca","Al Sur","Al Este","Por cualquier lado"],0,"Hay que pasar por el lado que dice su nombre."],
["bal","Rumbo Este, ves por la proa una cardinal Sur. Lo correcto es…",["Caer a estribor y pasar por su Sur","Caer a babor y pasar por el Norte","Dejarla por babor sin más","Pararse"],0,"Rumbo 090: el Sur queda a estribor."],
["bal","Rumbo Oeste, ves por la proa una cardinal Norte. Lo correcto es…",["Caer a estribor y pasar por su Norte","Caer a babor y pasar por el Sur","Es un peligro aislado","Dejarla por estribor"],0,"Rumbo 270: el Norte queda a estribor."],
["bal","Marca de peligro aislado: marca de tope…",["Dos esferas negras","Una esfera roja","Aspa amarilla","Dos conos"],0,"Peligro aislado: negra con franja roja, 2 esferas negras, luz blanca Fl(2)."],
["bal","Marca de aguas navegables: marca de tope…",["Una esfera roja","Dos esferas negras","Aspa amarilla","Cilindro rojo"],0,"Franjas verticales rojas y blancas; luz blanca isofase, ocultación, destello largo o Morse 'A'."],
["bal","Una luz que hace la letra Morse 'A' (· –) es una marca de…",["Aguas navegables","Peligro aislado","Canal principal a babor","Especial"],0,"Morse A = aguas navegables (aguas seguras)."],
["bal","Una zona de acuicultura o de ejercicios militares se señaliza con…",["Marca especial: amarilla con aspa","Cardinal","Lateral","Peligro aislado"],0,"Especiales: amarillas, aspa amarilla, luz amarilla."],
["bal","¿Qué marca indica por qué lado se debe pasar un peligro?",["La cardinal","La lateral","La especial","La de aguas navegables"],0,"Cardinal: te dice el cuadrante navegable respecto al peligro."],
["bal","Nuevo peligro (aún sin publicar en cartas): ¿colores?",["Franjas verticales azules y amarillas","Rojo y blanco","Negro y amarillo","Verde"],0,"Azul y amarillo, con luz que alterna azul y amarillo."],
// ---- RIPA
["ripa","Marca de día de un buque sin gobierno:",["Dos bolas negras en vertical","Una bola","Tres bolas","Bola-rombo-bola"],0,"De noche: dos luces rojas todo horizonte en vertical."],
["ripa","Marca de día de un buque varado:",["Tres bolas negras en vertical","Dos bolas","Una bola","Un cilindro"],0,"De noche: luces de fondeo + dos rojas en vertical."],

const KEY="per_sim_v1";
let S={}; try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
S.seen=S.seen||{}; S.wrong=S.wrong||{}; S.exams=S.exams||[];
const BANK=Q.map((x,i)=>({id:i,u:x[0],q:x[1],o:x[2],a:x[3],e:x[4]}));
const byU=u=>BANK.filter(b=>b.u===u);
const uName=u=>UNITS.find(x=>x.id===u).n;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function prep(b){const idx=shuffle([0,1,2,3]);return {...b,opts:idx.map(i=>b.o[i]),ans:idx.indexOf(b.a)}}
// ---- Repetición espaciada (cajas de Leitner): caja 0..4. Dominada = caja >= 3 (acertada 3 veces seguidas con días por medio).
const DAY=864e5, GAP=[0,1,3,7,16];
S.m=S.m||{}; S.days=S.days||[]; S.t=S.t||0;
const today=()=>new Date().toISOString().slice(0,10);
function box(id){return (S.m[id]||{}).b||0}
function mastered(id){return box(id)>=3}
function due(id){const m=S.m[id]; return m && Date.now()>=m.d}
function mark(b,ok){
  S.seen[b.id]=(S.seen[b.id]||0)+1;
  const m=S.m[b.id]||{b:0,d:0};
  if(ok){ m.b=Math.min(4,m.b+1); if(S.wrong[b.id]){S.wrong[b.id]--; if(S.wrong[b.id]<=0)delete S.wrong[b.id]} }
  else { m.b=0; S.wrong[b.id]=(S.wrong[b.id]||0)+1 }
  m.d=Date.now()+GAP[m.b]*DAY - 3600e3; S.m[b.id]=m;
  if(!S.days.includes(today())){S.days.push(today()); S.days=S.days.slice(-60)}
  save();
}
function uMastery(u){const all=byU(u);return all.filter(b=>mastered(b.id)).length/all.length}
function streak(){let n=0,d=new Date();for(;;){const k=d.toISOString().slice(0,10); if(S.days.includes(k)){n++;d=new Date(d-DAY)} else if(n===0&&k===today()){d=new Date(d-DAY)} else break} return n}
function readiness(){
  const est=Math.floor(UNITS.reduce((a,u)=>a+u.q*uMastery(u.id),0)); // solo lo que dominas de verdad
  const mins=UNITS.filter(u=>u.min).every(u=>Math.floor(u.q*uMastery(u.id))>=u.min);
  const last3=S.exams.slice(-3); const sims=last3.length===3&&last3.every(e=>e.ok&&e.s>=36);
  const dom=BANK.filter(b=>mastered(b.id)).length/BANK.length;
  return {est:Math.round(est),mins,sims,dom,ready:dom>=0.85&&mins&&sims};
}

function save(){S.t=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} if(DBREF){clearTimeout(syncTimer); syncTimer=setTimeout(()=>{DBREF.set({json:JSON.stringify(S),t:S.t}).then(()=>setSync("Guardado en tu cuenta")).catch(()=>setSync("No se pudo guardar en la cuenta; queda en este dispositivo"))},1500)}}
function setSync(t){syncMsg=t; const el=document.getElementById("sync"); if(el)el.textContent=t}
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]); if(!db||!user)return;
  const id=await user.id(); if(!id)return;
  DBREF=db.collection("data/users/"+id).doc("progreso");
  const snap=await DBREF.get();
  if(snap.exists){const r=snap.data(); if(r&&r.t>(S.t||0)){try{const R=JSON.parse(r.json); Object.assign(S,R); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} setSync("Progreso cargado de tu cuenta"); go(CUR)}catch(e){}} else if((S.t||0)>(r?r.t:0)){save()} else setSync("Guardado en tu cuenta")}
  else if(S.t){save()} else setSync("Se guardará en tu cuenta");
}catch(e){}})();

const LESSON={

const app=document.getElementById("app");
let timerId=null, CUR="inicio";
function setTab(v){document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v))}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.v));

  <section class="card stack">
    <div class="eyebrow">¿Estás listo para el examen?</div>

      <li class="${R.dom>=0.85?"y":""}">Dominar el 85 % de las preguntas (llevas ${Math.round(R.dom*100)} %)</li>

function lesson(u){
  const all=byU(u), pend=all.filter(b=>!mastered(b.id));
  app.innerHTML=`<section class="card stack lesson"><div class="eyebrow">Lección · ${uName(u)}</div><h2>Lo que tienes que saber</h2>
  <ul>${LESSON[u].map(x=>`<li>${x}</li>`).join("")}</ul>
  <div class="row"><button class="btn flag" id="p1">Practicar las que no domino (${pend.length})</button><button class="btn alt" id="p2">Todas (${all.length})</button><button class="btn alt" id="bk">Volver</button></div></section>`;
  document.getElementById("p1").onclick=()=>practice(u,shuffle(pend.length?pend:all));
  document.getElementById("p2").onclick=()=>practice(u);
  document.getElementById("bk").onclick=()=>go("inicio");
}
function hoy(){
  const N=20, pick=[], has=new Set(), add=b=>{if(pick.length<N&&!has.has(b.id)){pick.push(b);has.add(b.id)}};
  shuffle(BANK.filter(b=>due(b.id))).forEach(add);
  BANK.filter(b=>S.wrong[b.id]).sort((a,b)=>S.wrong[b.id]-S.wrong[a.id]).forEach(add);
  const weak=UNITS.map(u=>({u,need:u.q*(1-uMastery(u.id))+(u.min?2:0)})).sort((a,b)=>b.need-a.need);
  for(const w of weak){shuffle(byU(w.u.id).filter(b=>!S.m[b.id])).slice(0,4).forEach(add)}
  shuffle(BANK.filter(b=>!mastered(b.id))).forEach(add);
  if(!pick.length){app.innerHTML=`<section class="card stack"><h2>Hoy no te toca nada</h2><p>Lo dominas todo. Haz un simulacro para comprobarlo.</p><div class="row"><button class="btn flag" id="s">Simulacro</button></div></section>`;document.getElementById("s").onclick=()=>go("examen");return}
  practice(null,pick,"Sesión de hoy");
}

function practice(u,list,title){
  const qs=(list||shuffle(byU(u))).map(prep); let i=0,ok=0; title=title||(u?uName(u):"Mis fallos");
  function show(){
    if(i>=qs.length){const R=readiness();app.innerHTML=`<section class="card stack"><div class="eyebrow">${title}</div><div class="result">${ok}/${qs.length}</div><p>${ok===qs.length?"Perfecto.":"Las que fallaste volverán mañana para que las fijes."} Dominas ya el <b>${Math.round(R.dom*100)} %</b> del temario.</p><div class="row"><button class="btn" id="again">Otra ronda</button><button class="btn alt" id="home">Inicio</button></div></section>`;document.getElementById("again").onclick=()=>title==="Sesión de hoy"?hoy():u?lesson(u):fallos();document.getElementById("home").onclick=()=>go("inicio");return}
    const b=qs[i];
    app.innerHTML=`<section class="card stack"><div class="qhead"><span>${uName(b.u)}</span><span class="mono">${i+1}/${qs.length} · ${ok} bien</span></div>
    <div class="qtext">${b.q}</div><div class="opts">${b.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${"abcd"[k]}</span><span>${o}</span></button>`).join("")}</div>
    <div id="fb"></div></section>`;
    app.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{
      if(app.querySelector(".opt.ok"))return; const k=+el.dataset.k, good=k===b.ans; if(good)ok++; mark(b,good);
      app.querySelectorAll(".opt").forEach(x=>{const kk=+x.dataset.k; if(kk===b.ans)x.classList.add("ok"); else if(kk===k)x.classList.add("bad")});
      document.getElementById("fb").innerHTML=`<div class="stack"><div class="explain"><b>${good?"Correcto.":"Incorrecto."}</b> ${b.e}</div><div class="row"><button class="btn" id="next">Siguiente</button><button class="btn alt" id="out">Salir</button></div></div>`;
      document.getElementById("next").onclick=()=>{i++;show()}; document.getElementById("out").onclick=()=>go("inicio");
    });
  } show();
}

function examIntro(){
  app.innerHTML=`<section class="card stack"><div class="eyebrow">Simulacro</div><h2>45 preguntas en 90 minutos, como el examen</h2>
  <p>Mismo reparto por temas que el examen oficial. No verás si aciertas hasta entregar. Al final te digo si serías <b>apto</b> (32 bien y los mínimos de balizamiento, RIPA y carta).</p>
  <div class="row"><button class="btn flag" id="start">Empezar</button></div></section>`;
  document.getElementById("start").onclick=exam;
}
function exam(){
  const qs=UNITS.flatMap(u=>shuffle(byU(u.id)).slice(0,u.q)).map(prep); const ans=Array(qs.length).fill(null); let i=0, end=Date.now()+90*60e3;
  function fmt(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60e3),s=Math.floor(ms%60e3/1e3);return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
  function show(){
    const b=qs[i];
    app.innerHTML=`<div class="stack"><section class="card stack"><div class="qhead"><span>${uName(b.u)}</span><span class="timer" id="t">${fmt(end-Date.now())}</span></div>
    <div class="qtext"><span class="mono">${i+1}.</span> ${b.q}</div><div class="opts">${b.opts.map((o,k)=>`<button class="opt${ans[i]===k?" sel":""}" data-k="${k}"><span class="k">${"abcd"[k]}</span><span>${o}</span></button>`).join("")}</div>
    <div class="row"><button class="btn alt" id="prev" ${i?"":"disabled"}>Anterior</button><button class="btn" id="nx">${i<qs.length-1?"Siguiente":"Revisar"}</button><button class="btn flag" id="fin">Entregar</button></div></section>
    <section class="card stack"><div class="eyebrow">Hoja de respuestas · ${ans.filter(x=>x!==null).length}/45 contestadas</div><div class="grid45">${qs.map((_,k)=>`<button data-j="${k}" class="${ans[k]!==null?"done":""} ${k===i?"cur":""}">${k+1}</button>`).join("")}</div></section></div>`;
    app.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{ans[i]=+el.dataset.k; if(i<qs.length-1){i++} show()});
    document.getElementById("prev").onclick=()=>{i--;show()}; document.getElementById("nx").onclick=()=>{if(i<qs.length-1)i++;show()};
    document.getElementById("fin").onclick=confirmEnd; app.querySelectorAll(".grid45 button").forEach(el=>el.onclick=()=>{i=+el.dataset.j;show()});
  }
  function confirmEnd(){const blank=ans.filter(x=>x===null).length; const box=document.createElement("div"); box.className="card stack"; box.innerHTML=`<b>¿Entregar el examen?</b><span class="muted">${blank?`Te quedan ${blank} sin contestar. Los fallos no restan: mejor marcar algo.`:"Has contestado todas."}</span><div class="row"><button class="btn flag" id="yes">Sí, entregar</button><button class="btn alt" id="no">Seguir</button></div>`; app.prepend(box); document.getElementById("yes").onclick=finish; document.getElementById("no").onclick=()=>box.remove(); window.scrollTo(0,0)}
  function finish(){
    clearInterval(timerId); const res={}; let tot=0;
    qs.forEach((b,k)=>{const g=ans[k]===b.ans; if(ans[k]!==null)mark(b,g); res[b.u]=res[b.u]||{ok:0,n:0}; res[b.u].n++; if(g){res[b.u].ok++;tot++}});
    const mins=UNITS.filter(u=>u.min).map(u=>({u,ok:res[u.id].ok>=u.min}));
    const apto=tot>=32&&mins.every(m=>m.ok); S.exams.push({d:Date.now(),s:tot,ok:apto}); save();
    app.innerHTML=`<div class="stack"><section class="card stack"><div class="eyebrow">Resultado</div><div class="row"><div class="result">${tot}/45</div><span class="pill ${apto?"ok":"bad"}">${apto?"APTO":"NO APTO"}</span></div>
    <div class="tw"><table><tr><th>Tema</th><th>Bien</th><th>Mínimo</th></tr>${UNITS.map(u=>`<tr><td>${u.n}</td><td class="mono">${res[u.id].ok}/${res[u.id].n}</td><td>${u.min?(res[u.id].ok>=u.min?'<span class="pill ok">OK</span>':'<span class="pill bad">Falta</span>'):"—"}</td></tr>`).join("")}</table></div>
    <div class="row"><button class="btn" id="rev">Ver correcciones</button><button class="btn alt" id="home">Inicio</button></div></section><div id="review" class="stack"></div></div>`;
    document.getElementById("home").onclick=()=>go("inicio");
    document.getElementById("rev").onclick=()=>{document.getElementById("review").innerHTML=qs.map((b,k)=>{const g=ans[k]===b.ans;return `<section class="card stack"><div class="qhead"><span>${k+1}. ${uName(b.u)}</span><span class="pill ${g?"ok":"bad"}">${g?"Bien":ans[k]===null?"En blanco":"Mal"}</span></div><div><b>${b.q}</b></div><div class="muted">Correcta: <b>${b.opts[b.ans]}</b>${!g&&ans[k]!==null?` · Tu respuesta: ${b.opts[ans[k]]}`:""}</div><div class="explain">${b.e}</div></section>`}).join("")};
  }
  show(); timerId=setInterval(()=>{const t=document.getElementById("t"); if(t)t.textContent=fmt(end-Date.now()); if(Date.now()>=end){finish()}},1000);
}

function fallos(){
  const list=BANK.filter(b=>S.wrong[b.id]).sort((a,b)=>S.wrong[b.id]-S.wrong[a.id]);
  app.innerHTML=`<section class="card stack"><div class="eyebrow">Mis fallos</div><h2>${list.length?`${list.length} preguntas por repasar`:"Sin fallos guardados"}</h2>
  <p class="muted">${list.length?"Cada vez que aciertas una, baja su contador; al llegar a cero sale de la lista.":"Cuando falles en la práctica o en un simulacro, aparecerán aquí."}</p>
  ${list.length?`<div class="row"><button class="btn flag" id="rep">Repasar mis fallos</button></div><div class="tw"><table><tr><th>Pregunta</th><th>Tema</th><th>Fallos</th></tr>${list.map(b=>`<tr><td>${b.q}</td><td>${uName(b.u)}</td><td class="mono">${S.wrong[b.id]}</td></tr>`).join("")}</table></div>`:""}</section>`;
  const r=document.getElementById("rep"); if(r)r.onclick=()=>practice(null,shuffle(list));
}
